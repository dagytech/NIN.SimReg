server.port=8084

# ---- MySQL (XAMPP) ----
# XAMPP kwa default: username=root, HAKUNA password (acha wazi kabisa)
# Hakikisha XAMPP Control Panel - MySQL iko "Start" (kijani) kabla ya kuendesha
spring.datasource.url=jdbc:mysql://localhost:3306/simregdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Dagy@tech08.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =====================================================================
# USALAMA (SECURITY) - MPYA
# =====================================================================

# ---- API Key ya tuli (static token) - "mlango wa kwanza" kabla ya usajili.
# Ni SIRI iliyofichwa ndani ya mobile app tu - siyo mtumiaji anaijua/anaiona.
# Bila hii, HAKUNA request inayoweza kufika kwenye endpoints za usajili.
app.security.api-key=SIMREG-MOBILE-APP-2026-9f3a7c1e

# ---- Siri ya kusaini maombi (HMAC-SHA256) - kuzuia mtu "kubadilisha" data
# njiani (tampering) na kuzuia "replay attacks" (kutuma request ile ile mara mbili)
app.security.signing-secret=b7e2f9c4a1d68e3f0c5b9a2d7e4f1c8b3a6d9e0f2c5b8a1d4e7f0c3b6a9d2e5f

# Dirisha la muda linaloruhusiwa kati ya kutengeneza signature na kufika kwa server
# (dakika 5) - nje ya hii, request inakataliwa kama "stale/replayed"
app.security.replay-window-seconds=300

# ---- JWT (JSON Web Token) - kwa Agent/Admin login (stateless)
app.security.jwt-secret=f4a8c2e6b9d1f5a3c7e0b4d8f2a6c9e3b7d0f4a8c2e6b9d1f5a3c7e0b4d8f2a6
app.security.jwt-expiry-minutes=15

# ---- Encryption key kwa data nyeti (fingerprint template) - AES-256
app.security.encryption-key=MySuperSecretKey1234567890123456

# ---- Rate limiting - maombi mangapi yanaruhusiwa kwa dakika kwa kila IP/kifaa
app.security.rate-limit-per-minute=10

